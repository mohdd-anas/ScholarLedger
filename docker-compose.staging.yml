services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pb1
      POSTGRES_USER: pb1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the staging environment}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pb1"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: ${APP_IMAGE:-pb1-app:latest}
    container_name: pb1-app
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the staging environment}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the staging environment}
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/healthz'); r.raise_for_status()"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  staging_pgdata:
