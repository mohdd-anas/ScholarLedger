[project]
name = "pb1-publication-tracker"
version = "0.1.0"
description = "University Research Publication Tracking System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.17",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.0",
    "rapidfuzz>=3.10.0",
    "bibtexparser>=2.0.0b7",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "unidecode>=1.3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7.0",
    "coverage>=7.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101", "S106", "S105", "B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests that require a running database",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

