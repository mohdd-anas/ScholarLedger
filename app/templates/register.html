{% extends "base.html" %}
{% block title %}Register — ScholarLedger{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="card">
        <h1 class="card-title">Create Account</h1>
        <form method="post" action="/register">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Dr. Jane Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="jane@university.edu">
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" required placeholder="Computer Science">
            </div>
            <div class="form-group">
                <label for="orcid_id">ORCID iD (optional)</label>
                <input type="text" id="orcid_id" name="orcid_id" placeholder="0000-0001-2345-6789"
                       pattern="\d{4}-\d{4}-\d{4}-\d{3}[\dX]">
                <small class="text-muted">Format: 0000-0001-2345-6789</small>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
        </form>
        <p class="text-muted mt-2 text-center">
            Already have an account? <a href="/login">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
