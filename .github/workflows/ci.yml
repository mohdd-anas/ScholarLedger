name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write  # For cosign keyless signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────
  # Stage 1: Secret Scan (Gitleaks)
  # ──────────────────────────────────────────────────
  secret-scan:
    name: "🔐 Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: security/.gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────
  # Stage 2: Lint + Tests
  # ──────────────────────────────────────────────────
  lint-test:
    name: "🧪 Lint + Tests"
    runs-on: ubuntu-latest
    needs: secret-scan
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pb1_test
          POSTGRES_USER: pb1
          POSTGRES_PASSWORD: pb1secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pb1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://pb1:pb1secret@localhost:5432/pb1_test
          DATABASE_URL: postgresql://pb1:pb1secret@localhost:5432/pb1_test
          SECRET_KEY: ci-test-secret-key
        run: pytest tests/integration -v --tb=short

      - name: Run full test suite with coverage
        env:
          TEST_DATABASE_URL: postgresql://pb1:pb1secret@localhost:5432/pb1_test
          DATABASE_URL: postgresql://pb1:pb1secret@localhost:5432/pb1_test
          SECRET_KEY: ci-test-secret-key
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v
          echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true

  # ──────────────────────────────────────────────────
  # Stage 3: SAST + SCA
  # ──────────────────────────────────────────────────
  codeql:
    name: "🛡️ CodeQL SAST"
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  sca:
    name: "📦 Dependency Audit (SCA)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pip-audit
        run: |
          pip-audit --skip-editable --desc on --fix --dry-run 2>&1 | tee audit-results.txt
          # Fail if any vulnerability with a fix is found
          pip-audit --skip-editable 2>&1 || {
            echo "::error::Vulnerable dependencies found with available fixes"
            exit 1
          }

  # ──────────────────────────────────────────────────
  # Stage 4: Build Docker Image
  # ──────────────────────────────────────────────────
  build:
    name: "🏗️ Build Image"
    runs-on: ubuntu-latest
    needs: [lint-test, codeql, sca]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────
  # Stage 5: Image Scan (Trivy)
  # ──────────────────────────────────────────────────
  image-scan:
    name: "🔍 Image Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ──────────────────────────────────────────────────
  # Stage 6: Sign + SBOM
  # ──────────────────────────────────────────────────
  sign-sbom:
    name: "✍️ Sign + SBOM"
    runs-on: ubuntu-latest
    needs: image-scan
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            -o spdx-json=sbom.spdx.json
          echo "### SBOM Generated" >> $GITHUB_STEP_SUMMARY
          echo "Format: SPDX JSON" >> $GITHUB_STEP_SUMMARY

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}

      - name: Attach SBOM to image
        run: |
          cosign attach sbom \
            --sbom sbom.spdx.json \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp=".*" \
            --certificate-oidc-issuer-regexp=".*" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ──────────────────────────────────────────────────
  # Stage 7: Staging Deploy + DAST
  # ──────────────────────────────────────────────────
  staging:
    name: "🚀 Staging Deploy + DAST"
    runs-on: self-hosted
    needs: sign-sbom
    environment:
      name: staging
      url: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to staging
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          # Stop existing deployment
          docker compose -f docker-compose.staging.yml down --remove-orphans || true

          # Deploy with the new image
          export APP_IMAGE=$IMAGE_TAG
          docker compose -f docker-compose.staging.yml up -d --wait --timeout 60

          # Wait for app to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "App is healthy!"
              break
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done

      - name: Run smoke tests
        run: bash scripts/smoke_test.sh http://localhost:8000

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j"
          allow_issue_writing: false
        continue-on-error: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

      - name: Teardown staging (on failure)
        if: failure()
        run: docker compose -f docker-compose.staging.yml down --remove-orphans

  # ──────────────────────────────────────────────────
  # Stage 8: Production Promotion
  # ──────────────────────────────────────────────────
  production:
    name: "🎯 Production Deploy"
    runs-on: self-hosted
    needs: staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image signature before deploy
        run: |
          cosign verify \
            --certificate-identity-regexp=".*" \
            --certificate-oidc-issuer-regexp=".*" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }} || {
            echo "::error::Image signature verification failed — refusing to deploy unsigned image"
            exit 1
          }

      - name: Save current image tag for rollback
        run: |
          # Store current running image tag
          docker inspect --format='{{.Config.Image}}' pb1-app 2>/dev/null > /tmp/previous-image.txt || echo "none" > /tmp/previous-image.txt
          echo "Previous image: $(cat /tmp/previous-image.txt)"

      - name: Deploy to production
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          export APP_IMAGE=$IMAGE_TAG
          docker compose -f docker-compose.yml down --remove-orphans || true
          docker compose -f docker-compose.yml up -d --wait --timeout 60

      - name: Post-deploy health check
        id: health-check
        run: |
          sleep 10
          HEALTHY=false
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              HEALTHY=true
              echo "Health check passed on attempt $i"
              break
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 5
          done
          echo "healthy=$HEALTHY" >> $GITHUB_OUTPUT
          if [ "$HEALTHY" != "true" ]; then
            echo "::error::Post-deploy health check failed"
            exit 1
          fi

      - name: Run production smoke tests
        run: bash scripts/smoke_test.sh http://localhost:8000

  # ──────────────────────────────────────────────────
  # Stage 9: Automatic Rollback
  # ──────────────────────────────────────────────────
  rollback:
    name: "⏪ Rollback"
    runs-on: self-hosted
    needs: production
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Rollback to previous image
        run: |
          PREVIOUS_IMAGE=$(cat /tmp/previous-image.txt 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_IMAGE" ] || [ "$PREVIOUS_IMAGE" = "none" ]; then
            echo "::warning::No previous image found for rollback"
            exit 1
          fi

          echo "Rolling back to: $PREVIOUS_IMAGE"
          export APP_IMAGE=$PREVIOUS_IMAGE
          docker compose -f docker-compose.yml down --remove-orphans || true
          docker compose -f docker-compose.yml up -d --wait --timeout 60

          # Verify rollback
          sleep 10
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Rollback successful — app is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Rollback also failed"
          exit 1
