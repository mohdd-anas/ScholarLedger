name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-test:
    name: Lint and tests
    runs-on: ubuntu-latest
    needs: secret-scan
    env:
      TEST_DATABASE_URL: sqlite:///./test_pb1.db
      SECRET_KEY: ci-test-secret-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pb1_test
          POSTGRES_USER: pb1
          POSTGRES_PASSWORD: pb1secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pb1"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check . --output-format=github
      - run: pytest tests/unit -v --tb=short
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://pb1:pb1secret@localhost:5432/pb1_test
          DATABASE_URL: postgresql+psycopg2://pb1:pb1secret@localhost:5432/pb1_test
        run: pytest tests/integration -v --tb=short
      - name: Run full suite with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://pb1:pb1secret@localhost:5432/pb1_test
          DATABASE_URL: postgresql+psycopg2://pb1:pb1secret@localhost:5432/pb1_test
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  sca:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pip-audit --skip-editable

  build-scan-sign:
    name: Build, scan, sign, and publish
    runs-on: ubuntu-latest
    needs: [lint-test, codeql, sca]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,prefix=sha-
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: anchore/sbom-action/download-syft@v0
      - name: Generate and attach SPDX SBOM
        run: syft "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" -o spdx-json=sbom.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign image and attach SBOM
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error

  staging:
    name: Staging deploy and DAST
    runs-on: self-hosted
    needs: build-scan-sign
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify signed image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-scan-sign.outputs.digest }}
        run: |
          cosign verify --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
      - name: Deploy staging
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-scan-sign.outputs.digest }}
          SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          test -n "$SECRET_KEY" && test -n "$DATABASE_URL"
          docker compose -f docker-compose.staging.yml up -d --pull always --wait --timeout 90
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
        run: bash scripts/smoke_test.sh "$BASE_URL"
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.STAGING_URL }}
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -j
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ github.sha }}
          path: report_html.html
          if-no-files-found: ignore

  production:
    name: Production deploy
    runs-on: self-hosted
    needs: [build-scan-sign, staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      previous-image: ${{ steps.previous.outputs.previous_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify signed image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-scan-sign.outputs.digest }}
        run: |
          cosign verify --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
      - name: Save current image for rollback
        id: previous
        run: |
          docker inspect --format='{{.Config.Image}}' pb1-app > "$RUNNER_TEMP/previous-image.txt" || echo none > "$RUNNER_TEMP/previous-image.txt"
          echo "previous_image=$(cat "$RUNNER_TEMP/previous-image.txt")" >> "$GITHUB_OUTPUT"
      - name: Deploy production
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-scan-sign.outputs.digest }}
          SECRET_KEY: ${{ secrets.PRODUCTION_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$SECRET_KEY" && test -n "$DATABASE_URL"
          docker compose up -d --pull always --wait --timeout 90
          bash scripts/smoke_test.sh "${{ vars.PRODUCTION_URL }}"

  rollback:
    name: Rollback production
    runs-on: self-hosted
    needs: production
    if: always() && needs.production.result == 'failure'
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous image
        run: |
          PREVIOUS_IMAGE="${{ needs.production.outputs.previous-image }}"
          if [ -z "$PREVIOUS_IMAGE" ] || [ "$PREVIOUS_IMAGE" = none ]; then
            echo "::error::No previous production image is available for rollback"
            exit 1
          fi
          APP_IMAGE="$PREVIOUS_IMAGE" docker compose up -d --wait --timeout 90
          bash scripts/smoke_test.sh "${{ vars.PRODUCTION_URL }}"
